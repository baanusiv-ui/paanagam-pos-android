name: Build Native Android APK

# Replaces .github/workflows/build-native-android.yml (same name and artifact as before).
# Changes: read-only token, cancel superseded runs, job timeout, no stored git credentials,
# Gradle cache written only from main, and test reports uploaded when a build fails.
on:
  workflow_dispatch:
  push:
    paths:
      - 'native-android/**'
      - '.github/workflows/build-native-android.yml'

permissions:
  contents: read

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-android
    steps:
      # Actions are pinned to major-version tags. For stronger supply-chain protection,
      # pin each to a full commit SHA (Dependabot's github-actions updates will then keep them current).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paanagam-native-test-reports
          path: native-android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: paanagam-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
